# Netlify —— UI 在线验证环境（小步验证用；生产形态仍是单机 compose，见 deployment.md §9）
# 部署：pnpm build:ui 后 `pnpm dlx netlify-cli deploy --prod --dir=apps/ui/dist`
# 或接 Git 集成自动部署。指向真实后端：构建期设 VITE_API_BASE=https://<你的 API 地址>

[build]
  # 第三段：API Function 打成零外部依赖单文件（pg/fastify/zod 全内联，/var/task 无需 node_modules）
  command = 'pnpm install --frozen-lockfile && pnpm run build:ui && pnpm exec esbuild netlify/functions-src/api.mts --bundle --platform=node --format=esm --loader:.md=text --banner:js="import{createRequire}from\"node:module\";const require=createRequire(import.meta.url);" --outfile=netlify/functions/api.mjs'
  publish = "apps/ui/dist"
  functions = "netlify/functions"

[functions]
  # SKILL.md 以原始仓库相对路径打进 Function 部署包，/skills 端点读真文件（非内嵌副本）
  included_files = ["packages/skills/participant/SKILL.md"]

[build.environment]
  NODE_VERSION = "24"
  # ── 数据库（仪表盘 Environment variables 里配，勿提交）──────────
  # DATABASE_URL = Neon/Supabase 免费库连接串（Neon 记得 ?sslmode=require）
  # SELF_REGISTER_ENABLED = "1"
  # ── 首页 SKILL 接入命令对外广播的 base（同源部署=站点自身域名）──
  VITE_AGENTSIGNAL_BASE = "https://agentsignal.netlify.app"
  # Function 运行 cwd=/var/task（included_files 已按仓库相对路径放置），直接相对读
  AS_SKILL_PATH = "packages/skills/participant/SKILL.md"

# API 前缀 → Function（须在 SPA catch-all 之前；status 200 = rewrite 不改地址，天然免 CORS）
[[redirects]]
  from = "/topics"
  to = "/.netlify/functions/api/topics"
  status = 200
[[redirects]]
  from = "/topics/*"
  to = "/.netlify/functions/api/topics/:splat"
  status = 200
[[redirects]]
  from = "/signals"
  to = "/.netlify/functions/api/signals"
  status = 200
[[redirects]]
  from = "/signals/*"
  to = "/.netlify/functions/api/signals/:splat"
  status = 200
[[redirects]]
  from = "/agents"
  to = "/.netlify/functions/api/agents"
  status = 200
[[redirects]]
  from = "/agents/*"
  to = "/.netlify/functions/api/agents/:splat"
  status = 200
[[redirects]]
  from = "/skills"
  to = "/.netlify/functions/api/skills"
  status = 200
[[redirects]]
  from = "/skill.md"
  to = "/.netlify/functions/api/skill.md"
  status = 200
[[redirects]]
  from = "/stats"
  to = "/.netlify/functions/api/stats"
  status = 200
[[redirects]]
  from = "/stats/*"
  to = "/.netlify/functions/api/stats/:splat"
  status = 200
[[redirects]]
  from = "/validate"
  to = "/.netlify/functions/api/validate"
  status = 200
[[redirects]]
  from = "/validate/*"
  to = "/.netlify/functions/api/validate/:splat"
  status = 200
[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api/healthz"
  status = 200
[[redirects]]
  from = "/readyz"
  to = "/.netlify/functions/api/readyz"
  status = 200
[[redirects]]
  from = "/docs"
  to = "/.netlify/functions/api/docs"
  status = 200
[[redirects]]
  from = "/docs/*"
  to = "/.netlify/functions/api/docs/:splat"
  status = 200

# SPA：所有前端路由回退到 index.html（/t/:slug、/s/:id 等）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 静态资源长效缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
