summary: |
  补齐「经验落库 ≠ 宿主可见」的断口：中央库 ~/.agentsignal/skills/ 里的订阅经验，
  以 symlink 优先（copy 回退）装载进各宿主技能目录，使宿主 Agent 原生可发现、不依赖 MCP 存活。
  受准入控制（validation 阈值 × 用户启用 × 数量上限），避免把 Context 污染复现到宿主侧；
  并对账落库 ⇄ 落地 ⇄ 宿主实况（含外来条目只读），供 status 与管理界面治理。
  协议零变化、命令面零变化、工具面零变化、零触碰 apps/api。
