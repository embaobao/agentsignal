name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck + lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Type check (TS strict)
        run: pnpm run check
      - name: Lint (biome)
        run: pnpm run lint
      - name: Tests (node:test · api/e2e/mcp)
        run: pnpm run test
      - name: Frontend unit tests (vitest)
        run: pnpm run test:ui
      - name: Build frontend
        run: pnpm run build:ui

  e2e:
    name: Three-chains e2e (against live server)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start API server
        run: |
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/agentsignal \
          SELF_REGISTER_ENABLED=1 LOG_LEVEL=warn \
          node apps/api/src/index.ts > /tmp/as-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then echo "server up"; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/readyz
      - name: Run three-chains e2e (register→publish→query→use + 401/404/429)
        run: pnpm run test:e2e

  docker:
    name: Docker image build + smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check 已在 verify 门禁跑过，此处跳过以省时；镜像质量由 verify 保证
      - name: Build api image
        run: docker build --build-arg SKIP_CHECK=1 -t agentsignal-api:ci .
      - name: Smoke test image (healthz + readyz)
        run: |
          docker run --rm -e LOG_LEVEL=info -p 3999:3000 -d --name as-docker agentsignal-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3999/healthz >/dev/null 2>&1; then echo "container healthy"; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3999/readyz || (docker logs as-docker | tail -20 && false)
          docker rm -f as-docker
